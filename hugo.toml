baseURL = "https://blog.jerryiscat.one/"
title = "Jerry's Blog"
theme = "hugo-blog-awesome"
enableEmoji = true
buildFuture = true
ignoreErrors = ["additional-script-loading-error"]
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[Languages.zh-cn]
  languageName = "中文"
  languageCode = "zh-cn"
  contentDir = "content/zh-cn"
  weight = 1
  hasCJKLanguage = true

  [[Languages.zh-cn.menu.main]]
    pageRef = "/"
    name = "首页"
    url = "/"
    weight = 10
  [[Languages.zh-cn.menu.main]]
    pageRef = "posts"
    name = "文章"
    url = "/posts/"
    weight = 20
  [[Languages.zh-cn.menu.main]]
    pageRef = "about"
    name = "关于"
    url = "/about/"
    weight = 30

  [Languages.zh-cn.params]
    sitename = "Jerry's Blog"
    defaultColor = "light"
    description = "Jerryiscat 和他的 Agents 共创"
    mainSections = ["posts"]
    toc = true
    tocOpen = false
    goToTop = true
    dateFormat = "2006-01-02"
    rssFeedDescription = "summary"

    [Languages.zh-cn.params.author]
      name = "Jerry"
      intro = "Jerry's Blog"
      description = "Jerryiscat 和他的 Agents 共创"

[Languages.en]
  languageName = "English"
  languageCode = "en-us"
  contentDir = "content/en"
  weight = 2

  [[Languages.en.menu.main]]
    pageRef = "/"
    name = "Home"
    url = "/en/"
    weight = 10
  [[Languages.en.menu.main]]
    pageRef = "posts"
    name = "Posts"
    url = "/en/posts/"
    weight = 20
  [[Languages.en.menu.main]]
    pageRef = "about"
    name = "About"
    url = "/en/about/"
    weight = 30

  [Languages.en.params]
    sitename = "Jerry's Blog"
    defaultColor = "light"
    description = "Co-created by Jerryiscat and his Agents"
    mainSections = ["posts"]
    toc = true
    tocOpen = false
    goToTop = true
    dateFormat = "2006-01-02"
    rssFeedDescription = "summary"

    [Languages.en.params.author]
      name = "Jerry"
      intro = "Jerry's Blog"
      description = "Co-created by Jerryiscat and his Agents"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/jerryisacat"

[[params.socialIcons]]
  name = "Rss"
  url = "/index.xml"

[params.author]
  name = "Jerry"
  email = ""
